<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comprajogos - Chaves Steam com Entrega Instantânea</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background-color: #0b0e14; color: #fff; }
        header { background: #171a21; color: white; padding: 24px 20px; text-align: center; border-bottom: 1px solid #2a475e; }
        header h1 { color: #66c0f4; font-size: 28px; }
        header p { color: #8f98a0; font-size: 14px; margin-top: 6px; }
        
        .search-container { margin-top: 15px; }
        .search-container input {
            width: 100%; max-width: 400px; padding: 10px 15px; border-radius: 4px; border: 1px solid #2a475e;
            background: #1b2838; color: white; font-size: 14px; outline: none;
        }
        .search-container input:focus { border-color: #66c0f4; }

        main { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .catalog h2 { font-size: 22px; margin-bottom: 20px; color: #c7d5e0; border-bottom: 2px solid #2a475e; padding-bottom: 8px; }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }

        .game-card {
            background: #16202d;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #2a475e;
            transition: transform 0.2s;
            display: flex;
            flex-direction: column;
        }

        .game-card:hover { transform: translateY(-4px); border-color: #66c0f4; }

        .game-card img {
            width: 100%;
            height: 140px;
            object-fit: cover;
        }

        .game-info {
            padding: 15px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            justify-content: space-between;
        }

        .game-info h3 { font-size: 16px; margin-bottom: 8px; color: #ffffff; }
        .price { font-size: 16px; font-weight: bold; color: #a4d007; margin-bottom: 12px; }

        .btn-comprar {
            display: block;
            text-align: center;
            background: linear-gradient(to bottom, #75b126 5%, #528212 100%);
            color: white;
            padding: 8px 12px;
            border-radius: 4px;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
        }

        .btn-comprar:hover { background: linear-gradient(to bottom, #8cd730 5%, #629c15 100%); }
    </style>
</head>
<body>
    <header>
        <h1>Comprajogos</h1>
        <p>Chaves Steam com entrega instantânea</p>
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Pesquisar por jogos..." onkeyup="filtrarJogos()">
        </div>
    </header>

    <main>
        <section class="catalog">
            <h2>Catálogo em Destaque</h2>
            <div id="games-grid" class="games-grid">
                <p style="text-align: center; color: #888;">Carregando jogos...</p>
            </div>
        </section>
    </main>

    <script>
        const jogosFallback = [
            { name: "Baldur's Gate 3", price: "R$ 199,90", image: "https://images.unsplash.com/photo-1538481199705-c710c4e965fc?w=500", category: "RPG" },
            { name: "Cyberpunk 2077", price: "R$ 199,90", image: "https://images.unsplash.com/photo-1542751371-adc38448a05e?w=500", category: "Ação" },
            { name: "Hollow Knight", price: "R$ 46,99", image: "https://images.unsplash.com/photo-1612287233002-ef1d000f37d2?w=500", category: "Indie" },
            { name: "Elden Ring", price: "R$ 229,90", image: "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=500", category: "RPG" },
            { name: "Counter-Strike 2", price: "Gratuito", image: "https://images.unsplash.com/photo-1550745165-9bc0b252726f?w=500", category: "Esportes" },
            { name: "Word Rescue", price: "R$ 15,90", image: "https://images.unsplash.com/photo-1511512578047-dfb367046420?w=500", category: "Indie" }
        ];

        let listaJogosAtuais = [];

        function renderizarJogos(jogos) {
            const grid = document.getElementById('games-grid');
            grid.innerHTML = '';

            if (!jogos || jogos.length === 0) {
                grid.innerHTML = '<p>Nenhum jogo encontrado.</p>';
                return;
            }

            jogos.forEach(jogo => {
                const card = document.createElement('div');
                card.className = 'game-card';
                card.innerHTML = `
                    <img src="${jogo.image || 'https://images.unsplash.com/photo-1550745165-9bc0b252726f?w=500'}" alt="${jogo.name}">
                    <div class="game-info">
                        <h3>${jogo.name}</h3>
                        <p class="price">${jogo.price}</p>
                        <a href="produto.html?nome=${encodeURIComponent(jogo.name)}" class="btn-comprar">Garantir Chave</a>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        async function carregarCatalogo() {
            try {
                const response = await fetch('/api/jogos');
                const data = await response.json();
                
                if (!response.ok || !data || (Array.isArray(data) && data.length === 0)) {
                    throw new Error('API indisponível ou vazia');
                }

                listaJogosAtuais = Array.isArray(data) ? data : jogosFallback;
                renderizarJogos(listaJogosAtuais);
            } catch (error) {
                console.warn('Usando dados de fallback local devido a:', error.message);
                listaJogosAtuais = jogosFallback;
                renderizarJogos(listaJogosAtuais);
            }
        }

        function filtrarJogos() {
            const termo = document.getElementById('searchInput').value.toLowerCase();
            const filtrados = listaJogosAtuais.filter(j => j.name.toLowerCase().includes(termo));
            renderizarJogos(filtrados);
        }

        window.onload = carregarCatalogo;
    </script>
</body>
</html>

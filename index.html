<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comprajogos | Loja Premium</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Biblioteca do Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    
    <style>
        .glass { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); transition: all 0.3s ease; }
        .glass:hover { border-color: rgba(99, 102, 241, 0.5); }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
    
    <!-- Cabeçalho (Header) -->
    <header class="fixed top-0 w-full z-40 glass shadow-2xl">
        <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
            
            <!-- Logo -->
            <div class="flex items-center gap-2">
                <div class="bg-indigo-600 p-2 rounded-xl text-white">🎮</div>
                <h1 class="text-2xl font-black tracking-tighter text-white">COMPRAJOGOS</h1>
            </div>

            <!-- Área da Direita: Login do Google e Carrinho -->
            <div class="flex items-center gap-4">
                
                <!-- Div Invisível (Configuração do Google) -->
                <div id="g_id_onload"
                     data-client_id="75702393897-88uv9hvhq0gi23n0vqk75m3.apps.googleusercontent.com"
                     data-callback="handleCredentialResponse"
                     data-auto_prompt="false">
                </div>
                
                <!-- O Botão Visual do Google aparecerá aqui -->
                <div class="g_id_signin" data-type="standard" data-shape="rectangular" data-theme="outline" data-text="signin_with" data-size="large" data-logo_alignment="left"></div>
                
                <!-- Texto de Saudação (Oculto até logar) -->
                <div id="user-info" class="text-white text-sm font-bold hidden"></div>

                <button onclick="toggleCart()" class="relative p-2 hover:bg-slate-800 rounded-full transition-all">
                    🛒
                    <span id="cartCount" class="absolute -top-1 -right-1 bg-indigo-600 text-[10px] w-5 h-5 flex items-center justify-center rounded-full">0</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Corpo Principal (Lista de Jogos) -->
    <main class="max-w-6xl mx-auto px-4 pt-28 pb-12">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            
            <!-- Jogo 1 -->
            <div class="glass p-6 rounded-2xl flex flex-col items-center text-center gap-4">
                <img src="https://shared.cloudflare.steamstatic.com/store_item_assets/steam/apps/11260/header.jpg" alt="Weird Worlds" class="rounded-xl w-full object-cover">
                <h2 class="text-xl font-bold">Weird Worlds: Return to Infinite Space</h2>
                <p class="text-slate-400">Chave Steam</p>
                <p class="text-2xl font-black text-indigo-400">R$ 19,90</p>
                <button onclick="comprarJogo('Weird Worlds', 19.90)" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 px-4 rounded-xl transition-all">
                    Comprar com Mercado Pago
                </button>
            </div>

            <!-- Jogo 2 -->
            <div class="glass p-6 rounded-2xl flex flex-col items-center text-center gap-4">
                <img src="https://shared.cloudflare.steamstatic.com/store_item_assets/steam/apps/358260/header.jpg" alt="Word Rescue" class="rounded-xl w-full object-cover">
                <h2 class="text-xl font-bold">Word Rescue</h2>
                <p class="text-slate-400">Chave Steam</p>
                <p class="text-2xl font-black text-indigo-400">R$ 9,90</p>
                <button onclick="comprarJogo('Word Rescue', 9.90)" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 px-4 rounded-xl transition-all">
                    Comprar com Mercado Pago
                </button>
            </div>

            <!-- Jogo 3 -->
            <div class="glass p-6 rounded-2xl flex flex-col items-center text-center gap-4">
                <img src="https://via.placeholder.com/460x215/1e293b/ffffff?text=Adicionar+Jogo" alt="Outro Jogo" class="rounded-xl w-full object-cover">
                <h2 class="text-xl font-bold">Lançamento Surpresa</h2>
                <p class="text-slate-400">Chave Steam</p>
                <p class="text-2xl font-black text-indigo-400">R$ 49,90</p>
                <button onclick="comprarJogo('Lancamento', 49.90)" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 px-4 rounded-xl transition-all">
                    Comprar com Mercado Pago
                </button>
            </div>

        </div>
    </main>

    <!-- Scripts de Integração (Google e Mercado Pago) -->
    <script>
        // 1. Processar Login do Google
        function handleCredentialResponse(response) {
            fetch('/api/auth/google', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token: response.credential })
            })
            .then(res => res.json())
            .then(data => {
                if(data.success) {
                    // Salvar usuário localmente
                    localStorage.setItem('usuario', JSON.stringify(data.user));
                    mostrarUsuarioLogado(data.user);
                } else {
                    alert('Erro ao realizar o login.');
                }
            })
            .catch(err => console.error('Erro na requisição de login:', err));
        }

        // 2. Atualizar o Menu (Ocultar botão, mostrar nome)
        function mostrarUsuarioLogado(user) {
            const infoDiv = document.getElementById('user-info');
            infoDiv.innerHTML = `Olá, <span class="text-indigo-400">${user.name}</span>!`;
            infoDiv.classList.remove('hidden');
            
            const btnLogin = document.querySelector('.g_id_signin');
            if(btnLogin) btnLogin.style.display = 'none';
        }

        // 3. Processar Pagamento
        function comprarJogo(nomeJogo, precoJogo) {
            const usuario = localStorage.getItem('usuario');
            if (!usuario) {
                alert('⚠️ Por favor, faça login com sua conta Google antes de comprar.');
                return;
            }

            alert(`Redirecionando para pagamento seguro de ${nomeJogo}...`);
            
            fetch('/api/criar-pagamento', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title: nomeJogo, price: precoJogo })
            })
            .then(res => res.json())
            .then(data => {
                if(data.init_point) {
                    window.location.href = data.init_point; // Vai para o Checkout do Mercado Pago
                } else {
                    alert('Ocorreu um erro ao gerar a cobrança.');
                }
            })
            .catch(err => console.error('Erro na requisição de pagamento:', err));
        }

        // 4. Manter a sessão logada ao atualizar a página
        window.onload = function() {
            const usuarioSalvo = localStorage.getItem('usuario');
            if (usuarioSalvo) {
                mostrarUsuarioLogado(JSON.parse(usuarioSalvo));
            }
        };

        function toggleCart() {
            alert("Carrinho será implementado em breve!");
        }
    </script>
</body>
</html>

        function exibirJogos(lista) {
            const catalogo = document.getElementById("catalogo");
            catalogo.innerHTML = "";
            lista.forEach(jogo => {
                const card = document.createElement("div");
                card.className = "card-jogo";
                card.innerHTML = `
                    <img src="${jogo.img}" alt="${jogo.titulo}">
                    <div class="card-conteudo">
                        <h2>${jogo.titulo}</h2>
                        <div class="preco-tag">${jogo.preco}</div>
                        <a href="produto.html" class="btn-comprar">Ver Detalhes</a>
                    </div>
                `;
                catalogo.appendChild(card);
            });
        }

        function filtrarJogos() {
            const termo = document.getElementById("searchInput").value.toLowerCase();
            const filtrados = jogos.filter(j => j.titulo.toLowerCase().includes(termo));
            exibirJogos(filtrados);
        }

        exibirJogos(jogos);
    </script>

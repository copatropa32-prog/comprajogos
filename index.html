<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comprajogos - Chaves Steam com entrega instantânea</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
    <header class="py-8 text-center bg-slate-900 border-b border-slate-800">
        <h1 class="text-4xl font-extrabold text-sky-400 tracking-tight">Comprajogos</h1>
        <p class="text-slate-400 mt-2">Chaves Steam com entrega instantânea</p>
        <div class="mt-6 max-w-md mx-auto px-4">
            <input type="text" id="searchInput" placeholder="Pesquisar por jogos..." class="w-full px-4 py-3 rounded-lg bg-slate-800 border border-slate-700 text-slate-100 focus:outline-none focus:border-sky-500" onkeyup="filtrarJogos()">
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-8">
        <h2 class="text-2xl font-bold mb-6 border-l-4 border-sky-500 pl-3">Catálogo em Destaque</h2>
        <div id="catalog" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <p class="text-slate-400 col-span-full text-center py-10">Carregando jogos da API...</p>
        </div>
    </main>

    <script>
        let listaJogosAtuais = [];

        async function carregarJogos() {
            try {
                const response = await fetch('/api/jogos');
                const jogos = await response.json();
                
                const catalog = document.getElementById('catalog');
                if (!Array.isArray(jogos) || jogos.length === 0) {
                    catalog.innerHTML = '<p class="text-slate-400 col-span-full text-center">Nenhum jogo encontrado no momento.</p>';
                    return;
                }

                listaJogosAtuais = jogos;
                renderizarJogos(listaJogosAtuais);
            } catch (err) {
                console.error('Erro ao carregar catálogo:', err);
                document.getElementById('catalog').innerHTML = '<p class="text-red-400 col-span-full text-center">Erro ao carregar o catálogo de jogos.</p>';
            }
        }

        function renderizarJogos(jogos) {
            const catalog = document.getElementById('catalog');
            catalog.innerHTML = jogos.map(jogo => `
                <div class="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden shadow-lg flex flex-col">
                    <img src="${jogo.image}" alt="${jogo.name}" class="h-40 w-full object-cover">
                    <div class="p-4 flex flex-col flex-grow justify-between">
                        <div>
                            <h3 class="font-bold text-lg mb-2 text-slate-200 truncate">${jogo.name}</h3>
                            <p class="text-sky-400 font-extrabold text-xl mb-4">${jogo.price}</p>
                        </div>
                        <button onclick="alert('Funcionalidade de compra integrada em breve!')" class="w-full bg-lime-600 hover:bg-lime-500 text-white font-bold py-2 px-4 rounded-lg transition-colors">
                            Garantir Chave
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function filtrarJogos() {
            const termo = document.getElementById('searchInput').value.toLowerCase();
            const filtrados = listaJogosAtuais.filter(j => j.name.toLowerCase().includes(termo));
            renderizarJogos(filtrados);
        }

        carregarJogos();
    </script>
</body>
</html>

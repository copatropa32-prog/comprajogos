<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comprajogos | Loja Premium</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Biblioteca do Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    
    <style>
        .glass { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); transition: all 0.3s ease; }
        .glass:hover { border-color: rgba(99, 102, 241, 0.5); }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
    
    <!-- Cabeçalho (Header) -->
    <header class="fixed top-0 w-full z-40 glass shadow-2xl">
        <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
            
            <!-- Logo -->
            <div class="flex items-center gap-2">
                <div class="bg-indigo-600 p-2 rounded-xl text-white">🎮</div>
                <h1 class="text-2xl font-black tracking-tighter text-white">COMPRAJOGOS</h1>
            </div>

            <!-- Área da Direita: Login do Google e Carrinho -->
            <div class="flex items-center gap-4">
                
                <!-- Google Login Config -->
                <div id="g_id_onload"
                     data-client_id="75702393897-88uv9hvhq0gi23n0vqk75m3.apps.googleusercontent.com"
                     data-callback="handleCredentialResponse"
                     data-auto_prompt="false">
                </div>
                
                <!-- Botão de Login do Google -->
                <div id="google-login-btn" class="g_id_signin" data-type="standard" data-shape="pill" data-theme="filled_black" data-text="signin_with" data-size="large"></div>
                
                <!-- Saudação do Usuário Logado -->
                <div id="user-info" class="text-white text-sm font-bold hidden flex items-center gap-2 bg-slate-900 px-4 py-2 rounded-full border border-indigo-500/30"></div>

                <!-- Carrinho -->
                <button onclick="toggleCart()" class="relative p-2 hover:bg-slate-800 rounded-full transition-all">
                    🛒
                    <span id="cartCount" class="absolute -top-1 -right-1 bg-indigo-600 text-[10px] w-5 h-5 flex items-center justify-center rounded-full">0</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Corpo Principal (Filtros e Catálogo Completo) -->
    <main class="max-w-6xl mx-auto px-4 pt-28 pb-12">
        
        <!-- Barra de Filtros e Pesquisa -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
            <input type="text" id="searchInput" placeholder="Buscar nome..." oninput="filtrarJogos()" class="bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-indigo-500">
            
            <select id="genreFilter" onchange="filtrarJogos()" class="bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-indigo-500">
                <option value="">Todos os Gêneros</option>
                <option value="FPS">FPS</option>
                <option value="MOBA">MOBA</option>
                <option value="RPG">RPG</option>
                <option value="Indie">Indie</option>
                <option value="Esportes">Esportes</option>
            </select>

            <select id="priceFilter" onchange="filtrarJogos()" class="bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-indigo-500">
                <option value="">Preço: Todos</option>
                <option value="free">Gratuito</option>
                <option value="paid">Pago</option>
            </select>
        </div>

        <!-- Grade de Jogos -->
        <div id="games-grid" class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <!-- Os jogos são injetados dinamicamente via JS -->
        </div>
    </main>

    <!-- Scripts de Funcionalidade e Integrações -->
    <script>
        // Catálogo completo preservado
        const catalogoJogos = [
            { id: 1, title: "Counter-Strike 2", price: 0.00, category: "FPS", image: "https://shared.cloudflare.steamstatic.com/store_item_assets/steam/apps/730/header.jpg" },
            { id: 2, title: "Dota 2", price: 0.00, category: "MOBA", image: "https://shared.cloudflare.steamstatic.com/store_item_assets/steam/apps/570/header.jpg" },
            { id: 3, title: "Team Fortress 2", price: 0.00, category: "FPS", image: "https://shared.cloudflare.steamstatic.com/store_item_assets/steam/apps/440/header.jpg" },
            { id: 4, title: "Warframe", price: 0.00, category: "RPG", image: "https://shared.cloudflare.steamstatic.com/store_item_assets/steam/apps/230410/header.jpg" },
            { id: 5, title: "Path of Exile", price: 0.00, category: "RPG", image: "https://shared.cloudflare.steamstatic.com/store_item_assets/steam/apps/238960/header.jpg" },
            { id: 6, title: "Destiny 2", price: 0.00, category: "FPS", image: "https://shared.cloudflare.steamstatic.com/store_item_assets/steam/apps/1085660/header.jpg" },
            { id: 7, title: "Rocket League", price: 0.00, category: "Esportes", image: "https://shared.cloudflare.steamstatic.com/store_item_assets/steam/apps/252950/header.jpg" },
            { id: 8, title: "Weird Worlds: Return to Infinite Space", price: 19.90, category: "RPG", image: "https://shared.cloudflare.steamstatic.com/store_item_assets/steam/apps/11260/header.jpg" },
            { id: 9, title: "Word Rescue", price: 9.90, category: "Indie", image: "https://shared.cloudflare.steamstatic.com/store_item_assets/steam/apps/358260/header.jpg" }
        ];

        function renderizarJogos(jogos) {
            const grid = document.getElementById('games-grid');
            grid.innerHTML = '';

            if (jogos.length === 0) {
                grid.innerHTML = `<p class="text-slate-400 col-span-full text-center py-8">Nenhum jogo encontrado.</p>`;
                return;
            }

            jogos.forEach(jogo => {
                const precoFormatado = jogo.price === 0 ? 'Gratuito' : `R$ ${jogo.price.toFixed(2).replace('.', ',')}`;
                const card = document.createElement('div');
                card.className = "glass p-4 rounded-2xl flex flex-col justify-between gap-4";
                card.innerHTML = `
                    <div>
                        <img src="${jogo.image}" alt="${jogo.title}" class="rounded-xl w-full h-32 object-cover mb-3">
                        <span class="text-[10px] bg-indigo-500/20 text-indigo-400 px-2 py-1 rounded-md font-semibold">${jogo.category}</span>
                        <h2 class="text-base font-bold mt-2 text-white line-clamp-1">${jogo.title}</h2>
                        <p class="text-slate-400 text-xs mt-0.5">${jogo.price === 0 ? 'Grátis na Steam' : 'Chave Steam Global'}</p>
                    </div>
                    <div>
                        <p class="text-lg font-black text-indigo-400 mb-3">${precoFormatado}</p>
                        <button onclick="comprarJogo('${jogo.title}', ${jogo.price})" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2 px-4 rounded-xl transition-all shadow-lg shadow-indigo-600/20 text-sm">
                            ${jogo.price === 0 ? 'Resgatar' : 'Comprar'}
                        </button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filtrarJogos() {
            const termo = document.getElementById('searchInput').value.toLowerCase();
            const genero = document.getElementById('genreFilter').value;
            const precoTipo = document.getElementById('priceFilter').value;

            const filtrados = catalogoJogos.filter(jogo => {
                const matchNome = jogo.title.toLowerCase().includes(termo);
                const matchGenero = genero === "" || jogo.category === genero;
                let matchPreco = true;
                if (precoTipo === "free") matchPreco = jogo.price === 0;
                if (precoTipo === "paid") matchPreco = jogo.price > 0;

                return matchNome && matchGenero && matchPreco;
            });

            renderizarJogos(filtrados);
        }

        // Login do Google
        function handleCredentialResponse(response) {
            fetch('/api/auth/google', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token: response.credential })
            })
            .then(res => res.json())
            .then(data => {
                if(data.success) {
                    localStorage.setItem('usuario', JSON.stringify(data.user));
                    mostrarUsuarioLogado(data.user);
                } else {
                    alert('Erro ao realizar o login.');
                }
            })
            .catch(err => console.error('Erro na requisição de login:', err));
        }

        function mostrarUsuarioLogado(user) {
            const infoDiv = document.getElementById('user-info');
            infoDiv.innerHTML = `👤 <span class="text-indigo-400">${user.name}</span>`;
            infoDiv.classList.remove('hidden');
            
            const btnLogin = document.getElementById('google-login-btn');
            if(btnLogin) btnLogin.style.display = 'none';
        }

        // Pagamento / Resgate
        function comprarJogo(nomeJogo, precoJogo) {
            if (precoJogo === 0) {
                alert(`🎮 ${nomeJogo} resgatado com sucesso!`);
                return;
            }

            const usuario = localStorage.getItem('usuario');
            if (!usuario) {
                alert('⚠️ Por favor, faça login com sua conta Google antes de prosseguir com a compra.');
                return;
            }

            fetch('/api/criar-pagamento', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title: nomeJogo, price: precoJogo })
            })
            .then(res => res.json())
            .then(data => {
                if(data.init_point) {
                    window.location.href = data.init_point;
                } else {
                    alert('Ocorreu um erro ao gerar a cobrança.');
                }
            })
            .catch(err => console.error('Erro na requisição de pagamento:', err));
        }

        window.onload = function() {
            renderizarJogos(catalogoJogos);
            const usuarioSalvo = localStorage.getItem('usuario');
            if (usuarioSalvo) {
                mostrarUsuarioLogado(JSON.parse(usuarioSalvo));
            }
        };

        function toggleCart() {
            alert("Carrinho vazio.");
        }
    </script>
</body>
</html>

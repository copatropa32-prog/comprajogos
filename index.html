<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CompraJogos - Chaves de Ativação Steam</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .carousel-destaque {
            background: linear-gradient(135deg, #1b2838, #2a475e);
            color: #fff;
            border-radius: 8px;
            padding: 30px;
            margin-bottom: 30px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .carousel-destaque h2 { font-size: 28px; color: #66c0f4; margin-bottom: 10px; }
        .carousel-destaque p { font-size: 16px; color: #c7d5e0; margin-bottom: 20px; }
        .btn-destaque { background-color: #5c7e10; color: #fff; padding: 12px 25px; border-radius: 4px; text-decoration: none; font-weight: bold; display: inline-block; transition: background 0.2s; }
        .btn-destaque:hover { background-color: #7da515; }
        .busca-container { margin-bottom: 25px; text-align: center; }
        .busca-container input { width: 100%; max-width: 500px; padding: 12px 15px; font-size: 16px; border: 1px solid #ccc; border-radius: 6px; outline: none; }
        .preco-tag { font-size: 16px; color: #66c0f4; font-weight: bold; margin-bottom: 15px; }
    </style>
</head>
<body>
    <header>
        <h1>CompraJogos</h1>
        <p>Sua loja digital de chaves Steam com entrega instantânea</p>
        <div class="nav-links">
            <a href="index.html">Início</a>
            <a href="quem-somos.html">Quem Somos</a>
            <a href="suporte.html">Suporte & FAQ</a>
        </div>
    </header>
    <main class="container">
        <!-- Carrossel / Destaque Principal -->
        <div class="carousel-destaque">
            <h2>Destaque da Semana: Baldur's Gate 3</h2>
            <p>Mergulhe na aclamada obra-prima do RPG com entrega imediata da chave digital.</p>
            <a href="produto.html?titulo=Baldur's%20Gate%203&preco=R%24%20199%2C90&img=https://images.unsplash.com/photo-1538481199705-c710c4e965fc%3Fw%3D500&link=https://www.kinguin.net/" class="btn-destaque">Ver Destaque</a>
        </div>

        <div class="busca-container">
            <input type="text" id="searchInput" placeholder="Pesquisar jogo..." onkeyup="filtrarJogos()">
        </div>
        <section class="grid-catalogo" id="catalogo">
            <!-- Carregado via JS -->
        </section>
    </main>
    <footer>
        <p>&copy; 2026 CompraJogos. Todos os direitos reservados.</p>
    </footer>

    <script>
        const jogos = [
            { titulo: "Counter-Strike 2", preco: "Gratuito", img: "https://images.unsplash.com/photo-1542751371-adc38448a05e?w=500", link: "https://store.steampowered.com/app/730/CounterStrike_2/" },
            { titulo: "Grand Theft Auto V", preco: "R$ 83,60", img: "https://images.unsplash.com/photo-1533850595775-f8f39423e67d?w=500", link: "https://www.kinguin.net/" },
            { titulo: "Cyberpunk 2077", preco: "R$ 199,90", img: "https://images.unsplash.com/photo-1607604276583-eef5d076aa5f?w=500", link: "https://www.kinguin.net/" },
            { titulo: "Elden Ring", preco: "R$ 229,90", img: "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=500", link: "https://www.kinguin.net/" },
            { titulo: "Baldur's Gate 3", preco: "R$ 199,90", img: "https://images.unsplash.com/photo-1538481199705-c710c4e965fc?w=500", link: "https://www.kinguin.net/" },
            { titulo: "Red Dead Redemption 2", preco: "R$ 299,99", img: "https://images.unsplash.com/photo-1560253023-3ec5d502959f?w=500", link: "https://www.kinguin.net/" },
            { titulo: "Hogwarts Legacy", preco: "R$ 249,99", img: "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=500", link: "https://www.kinguin.net/" },
            { titulo: "EA SPORTS FC 25", preco: "R$ 319,00", img: "https://images.unsplash.com/photo-1511512578047-dfb367046420?w=500", link: "https://www.kinguin.net/" },
            { titulo: "God of War", preco: "R$ 199,90", img: "https://images.unsplash.com/photo-1579373903781-fd5c0c30c4cd?w=500", link: "https://www.kinguin.net/" },
            { titulo: "Spider-Man Remastered", preco: "R$ 249,90", img: "https://images.unsplash.com/photo-1635863138275-d9b33299680b?w=500", link: "https://www.kinguin.net/" },
            { titulo: "Terraria", preco: "R$ 32,99", img: "https://images.unsplash.com/photo-1550745165-9bc0b252726f?w=500", link: "https://www.kinguin.net/" },
            { titulo: "Stardew Valley", preco: "R$ 24,99", img: "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=500", link: "https://www.kinguin.net/" },
            { titulo: "Hollow Knight", preco: "R$ 46,99", img: "https://images.unsplash.com/photo-1579546929518-9e396f3cc809?w=500", link: "https://www.kinguin.net/" },
            { titulo: "Hades", preco: "R$ 47,49", img: "https://images.unsplash.com/photo-1612287233202-b51b36671c5d?w=500", link: "https://www.kinguin.net/" },
            { titulo: "The Witcher 3: Wild Hunt", preco: "R$ 150,00", img: "https://images.unsplash.com/photo-1534447677768-be436bb09401?w=500", link: "https://www.kinguin.net/" },
            { titulo: "Weird Worlds: Return to Infinite Space", preco: "R$ 29,90", img: "https://images.unsplash.com/photo-1451187580459-43490279c0fa?w=500", link: "https://www.kinguin.net/" },
            { titulo: "Word Rescue", preco: "R$ 19,90", img: "https://images.unsplash.com/photo-1612287233202-b51b36671c5d?w=500", link: "https://www.kinguin.net/" }
        ];

        function exibirJogos(lista) {
            const catalogo = document.getElementById("catalogo");
            catalogo.innerHTML = "";
            lista.forEach(jogo => {
                const card = document.createElement("div");
                card.className = "card-jogo";
                const linkDetalhes = `produto.html?titulo=${encodeURIComponent(jogo.titulo)}&preco=${encodeURIComponent(jogo.preco)}&img=${encodeURIComponent(jogo.img)}&link=${encodeURIComponent(jogo.link)}`;
                card.innerHTML = `
                    <img src="${jogo.img}" alt="${jogo.titulo}">
                    <div class="card-conteudo">
                        <h2>${jogo.titulo}</h2>
                        <div class="preco-tag">${jogo.preco}</div>
                        <a href="${linkDetalhes}" class="btn-comprar">Ver Detalhes</a>
                    </div>
                `;
                catalogo.appendChild(card);
            });
        }

        function filtrarJogos() {
            const termo = document.getElementById("searchInput").value.toLowerCase();
            const filtrados = jogos.filter(j => j.titulo.toLowerCase().includes(termo));
            exibirJogos(filtrados);
        }

        exibirJogos(jogos);
    </script>
</body>
</html>

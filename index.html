<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comprajogos | Games Gratuitos</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
    
    <header class="border-b border-slate-800 bg-slate-900/90 backdrop-blur sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-black tracking-tighter text-indigo-500">COMPRAJOGOS</h1>
            <input type="text" id="searchInput" placeholder="Filtrar por nome..." oninput="renderizar()" class="bg-slate-800 rounded-lg px-4 py-2 text-sm text-white w-64 focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
    </header>

    <section class="max-w-6xl mx-auto px-4 py-10 text-center">
        <h2 class="text-4xl font-black mb-3">Catálogo de Jogos Gratuitos</h2>
        <p class="text-slate-400 max-w-2xl mx-auto text-sm">Seleção curada com os 200 melhores títulos Free-to-Play.</p>
    </section>

    <main class="max-w-6xl mx-auto px-4 pb-12">
        <div id="games-grid" class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <p class="text-slate-400 col-span-full text-center py-8">Buscando catálogo...</p>
        </div>
    </main>

    <script>
        let todosJogos = [];

        async function carregarJogos() {
            try {
                const response = await fetch('https://www.freetogame.com/api/games');
                const data = await response.json();
                
                // Exibe apenas jogos da API (sem itens manuais)
                todosJogos = data.slice(0, 200).map(jogo => ({
                    title: jogo.title,
                    category: jogo.genre,
                    image: jogo.thumbnail,
                    url: jogo.game_url
                }));
                renderizar();
            } catch (error) {
                document.getElementById('games-grid').innerHTML = "<p class='text-red-400 col-span-full text-center'>Erro ao conectar com a API.</p>";
            }
        }

        function renderizar() {
            const busca = document.getElementById('searchInput').value.toLowerCase();
            const grid = document.getElementById('games-grid');
            grid.innerHTML = '';

            const filtrados = todosJogos.filter(j => j.title.toLowerCase().includes(busca));

            if (filtrados.length === 0) {
                grid.innerHTML = '<p class="text-slate-400 col-span-full text-center py-8">Nenhum jogo encontrado.</p>';
                return;
            }

            filtrados.forEach(jogo => {
                const card = document.createElement('div');
                card.className = "bg-slate-900 p-4 rounded-xl border border-slate-800 hover:border-indigo-500 transition-all flex flex-col justify-between shadow-lg";
                card.innerHTML = `
                    <div>
                        <div class="overflow-hidden rounded-lg mb-3 bg-slate-950 aspect-video">
                            <img src="${jogo.image}" alt="${jogo.title}" class="w-full h-full object-cover hover:scale-105 transition-transform duration-300">
                        </div>
                        <span class="text-[10px] bg-indigo-500/10 text-indigo-400 px-2 py-1 rounded font-bold uppercase">${jogo.category}</span>
                        <h2 class="text-sm font-bold mt-2 mb-3 line-clamp-1 text-white">${jogo.title}</h2>
                    </div>
                    <div>
                        <a href="${jogo.url}" target="_blank" class="block w-full text-center bg-indigo-600 hover:bg-indigo-500 text-white py-2 rounded-lg text-sm font-bold transition-all">
                            Jogar Agora
                        </a>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        carregarJogos();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comprajogos | Loja Premium</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .glass { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); }
        .transition-all { transition: all 0.3s ease; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
    <!-- Header -->
    <header class="fixed top-0 w-full z-40 glass shadow-2xl">
        <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center gap-2">
                <div class="bg-indigo-600 p-2 rounded-xl text-white">🎮</div>
                <h1 class="text-2xl font-black tracking-tighter text-white">COMPRAJOGOS</h1>
            </div>
            <button onclick="toggleCart()" class="relative p-2 hover:bg-slate-800 rounded-full">
                🛒 <span id="cartCount" class="absolute -top-1 -right-1 bg-indigo-600 text-[10px] w-5 h-5 flex items-center justify-center rounded-full font-bold">0</span>
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-6xl mx-auto px-4 pt-28 pb-12">
        <!-- Filtros -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8 glass p-6 rounded-2xl">
            <input type="text" id="searchInput" placeholder="🔍 Buscar nome..." class="bg-slate-900 border border-slate-700 px-4 py-3 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none" onkeyup="filtrarJogos()">
            <select id="genreFilter" onchange="filtrarJogos()" class="bg-slate-900 border border-slate-700 px-4 py-3 rounded-xl outline-none">
                <option value="Todos">Todos os Gêneros</option>
            </select>
            <select id="priceFilter" onchange="filtrarJogos()" class="bg-slate-900 border border-slate-700 px-4 py-3 rounded-xl outline-none">
                <option value="Todos">Preço: Todos</option>
                <option value="Gratuito">Gratuito</option>
                <option value="Pago">Pago</option>
            </select>
        </div>

        <div id="catalog" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6"></div>
    </main>

    <!-- Sidebar Carrinho -->
    <div id="cartDrawer" class="fixed inset-y-0 right-0 z-50 w-80 glass transform translate-x-full transition-transform duration-300 p-6 flex flex-col shadow-2xl">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-xl font-bold">Seu Carrinho</h2>
            <button onclick="toggleCart()" class="text-slate-400 hover:text-white">✕</button>
        </div>
        <div id="cartItems" class="flex-grow space-y-4 overflow-y-auto"></div>
        <div class="border-t border-slate-700 pt-4 mt-4">
            <div class="flex justify-between font-bold text-lg mb-4"><span>Total:</span> <span id="cartTotal">R$ 0,00</span></div>
            <button onclick="finalizarCompra()" class="w-full bg-indigo-600 hover:bg-indigo-500 py-3 rounded-xl font-bold transition-all">Finalizar Pedido</button>
        </div>
    </div>

    <script>
        let listaJogos = [];
        let cart = [];

        async function init() {
            const res = await fetch('/api/jogos');
            listaJogos = await res.json();
            
            // Popular Gêneros
            const generos = ['Todos', ...new Set(listaJogos.map(j => j.genre))];
            const genreSelect = document.getElementById('genreFilter');
            generos.forEach(g => genreSelect.innerHTML += `<option value="${g}">${g}</option>`);
            
            renderizar(listaJogos);
        }

        function renderizar(jogos) {
            const container = document.getElementById('catalog');
            container.innerHTML = jogos.map(j => `
                <div class="group bg-slate-900 rounded-2xl overflow-hidden border border-slate-800 hover:border-indigo-500 transition-all shadow-lg hover:shadow-indigo-500/20">
                    <img src="${j.image}" class="h-40 w-full object-cover">
                    <div class="p-4">
                        <span class="text-[10px] font-bold text-indigo-400 bg-indigo-950 px-2 py-1 rounded">${j.genre}</span>
                        <h3 class="font-bold mt-2 h-12">${j.name}</h3>
                        <p class="text-lg font-black text-emerald-400 mb-4">${j.price}</p>
                        <button onclick="addToCart('${j.name}')" class="w-full bg-slate-800 hover:bg-indigo-600 py-2 rounded-lg text-sm font-bold transition-all">Adicionar ao Carrinho</button>
                    </div>
                </div>
            `).join('');
        }

        function filtrarJogos() {
            const termo = document.getElementById('searchInput').value.toLowerCase();
            const genero = document.getElementById('genreFilter').value;
            const preco = document.getElementById('priceFilter').value;

            const filtrados = listaJogos.filter(j => {
                const matchNome = j.name.toLowerCase().includes(termo);
                const matchGenero = genero === 'Todos' || j.genre === genero;
                const matchPreco = preco === 'Todos' ? true : (preco === 'Gratuito' ? j.price === 'Gratuito' : j.price !== 'Gratuito');
                return matchNome && matchGenero && matchPreco;
            });
            renderizar(filtrados);
        }

        function addToCart(name) {
            const jogo = listaJogos.find(j => j.name === name);
            cart.push(jogo);
            updateCart();
        }

        function updateCart() {
            document.getElementById('cartCount').innerText = cart.length;
            const items = document.getElementById('cartItems');
            items.innerHTML = cart.map((j, i) => `
                <div class="flex justify-between items-center bg-slate-950 p-2 rounded">
                    <span class="text-sm truncate w-32">${j.name}</span>
                    <span class="text-emerald-400 text-sm">${j.price}</span>
                    <button onclick="removeFromCart(${i})" class="text-red-400 hover:text-red-300">×</button>
                </div>
            `).join('');
            
            const total = cart.reduce((acc, curr) => acc + (curr.price === 'Gratuito' ? 0 : parseFloat(curr.price.replace('R$ ', '').replace(',', '.'))), 0);
            document.getElementById('cartTotal').innerText = `R$ ${total.toFixed(2).replace('.', ',')}`;
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            updateCart();
        }

        function toggleCart() {
            document.getElementById('cartDrawer').classList.toggle('translate-x-full');
        }

        function finalizarCompra() {
            if(cart.length === 0) return alert('Carrinho vazio!');
            alert('Pedido enviado! Chaves geradas no seu e-mail.');
            cart = [];
            updateCart();
            toggleCart();
        }

        init();
    </script>
</body>
</html>

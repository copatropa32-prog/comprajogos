<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Compra Jogos - As Melhores Ofertas de Keys e Jogos</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen">

  <!-- Header / Navbar -->
  <header class="border-b border-gray-800 bg-gray-950 p-4">
    <div class="container mx-auto flex justify-between items-center">
      <h1 class="text-2xl font-bold text-green-400">CompraJogos.com.br</h1>
      <nav class="space-x-4">
        <a href="#" class="hover:text-green-400">Catálogo</a>
        <a href="#" class="hover:text-green-400">Ofertas</a>
      </nav>
    </div>
  </header>

  <!-- Banner Hero -->
  <section class="py-12 bg-gradient-to-r from-gray-900 via-gray-800 to-gray-900 text-center">
    <h2 class="text-4xl font-extrabold mb-2">Sua Loja de Keys e Jogos Digitais</h2>
    <p class="text-gray-400">Ativação instantânea nas melhores plataformas (Steam, Xbox, PlayStation)</p>
  </section>

  <!-- Seção de Produtos -->
  <main class="container mx-auto py-10 px-4">
    <h3 class="text-xl font-bold mb-6 text-green-400">Catálogo em Destaque</h3>
    
    <div id="catalog" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
      <div class="bg-gray-800 p-4 rounded-lg animate-pulse h-48 flex items-center justify-center text-gray-500">
        Carregando produtos do Sandbox...
      </div>
    </div>
  </main>

  <!-- Script de Integração com o Backend -->
  <script>
    async function loadProducts() {
      const container = document.getElementById('catalog');
      try {
        const res = await fetch('/api/products');
        const data = await res.json();

        if (!data.items || data.items.length === 0) {
          container.innerHTML = '<p class="text-gray-400">Nenhum produto encontrado no catálogo de testes.</p>';
          return;
        }

        container.innerHTML = data.items.map(item => `
          <div class="bg-gray-800 rounded-lg p-4 flex flex-col justify-between border border-gray-700 hover:border-green-500 transition">
            <div>
              <h4 class="font-bold text-lg mb-2">${item.name || 'Jogo Digital'}</h4>
              <p class="text-xs text-gray-400 mb-4">Plataforma: ${item.platform || 'PC / DRM'}</p>
            </div>
            <div class="flex justify-between items-center mt-4 border-t border-gray-700 pt-3">
              <span class="text-green-400 font-bold text-xl">R$ ${item.price ? item.price.toFixed(2) : 'Consultar'}</span>
              <button class="bg-green-600 hover:bg-green-500 text-white px-3 py-1.5 rounded font-semibold text-sm">
                Comprar
              </button>
            </div>
          </div>
        `).join('');
      } catch (err) {
        container.innerHTML = `<p class="text-red-400">Erro ao carregar catálogo: ${err.message}</p>`;
      }
    }

    loadProducts();
  </script>
</body>
</html>

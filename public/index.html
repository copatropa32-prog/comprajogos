<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CompraJogos.com.br - Keys & Ofertas</title>
    <!-- Google AdSense -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9710931146430417" crossorigin="anonymous"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f0f1a;
            color: #ffffff;
            margin: 0;
            padding: 0;
        }

        .site-header {
            background: #161625;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            border-bottom: 2px solid #2d2d44;
        }

        .logo-container h1 {
            margin: 0;
            font-size: 1.8rem;
            color: #ffffff;
        }

        .logo-container h1 span {
            color: #10b981;
        }

        .logo-container h1 small {
            font-size: 0.9rem;
            color: #aaa;
        }

        .logo-container p {
            margin: 2px 0 0 0;
            font-size: 0.75rem;
            color: #888;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .search-container {
            display: flex;
            width: 100%;
            max-width: 500px;
            gap: 10px;
        }

        .search-container input {
            flex: 1;
            padding: 10px 15px;
            border-radius: 6px;
            border: 1px solid #2d2d44;
            background: #1e1e2f;
            color: #fff;
            font-size: 1rem;
        }

        .search-container button {
            padding: 10px 20px;
            border-radius: 6px;
            border: none;
            background: #6366f1;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .search-container button:hover {
            background: #4f46e5;
        }

        main {
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .destaques-container-wrapper, .catalog-section {
            margin-bottom: 40px;
        }

        .section-title {
            color: #ffffff;
            margin-bottom: 20px;
            font-size: 1.4rem;
            border-left: 4px solid #10b981;
            padding-left: 12px;
        }

        .destaques-grid, .catalogo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px;
        }

        .destaque-item, .jogo-card {
            background: #1e1e2f;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border: 1px solid #2d2d44;
            transition: transform 0.2s ease;
        }

        .destaque-item:hover, .jogo-card:hover {
            transform: translateY(-4px);
        }

        .destaque-item img, .jogo-card img {
            width: 100%;
            height: 160px;
            object-fit: cover;
        }

        .destaque-info, .jogo-info {
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .destaque-info h3, .jogo-info h3 {
            color: #ffffff;
            font-size: 1.05rem;
            margin: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .badge {
            font-size: 0.75rem;
            padding: 3px 8px;
            border-radius: 4px;
            width: fit-content;
            font-weight: bold;
        }

        .badge.pago { background: #3b82f6; color: #fff; }
        .badge.gratis { background: #10b981; color: #fff; }

        .preco {
            color: #10b981;
            font-weight: bold;
            font-size: 1rem;
        }

        .preco .de {
            text-decoration: line-through;
            color: #888;
            font-size: 0.85rem;
            margin-left: 5px;
        }

        .btn-comprar {
            display: inline-block;
            background: #6366f1;
            color: #fff;
            text-align: center;
            padding: 8px 12px;
            border-radius: 4px;
            text-decoration: none;
            font-weight: bold;
            margin-top: 5px;
            transition: background 0.2s;
        }

        .btn-comprar:hover {
            background: #4f46e5;
        }

        .site-footer {
            text-align: center;
            padding: 20px;
            background: #161625;
            color: #888;
            border-top: 1px solid #2d2d44;
            margin-top: 40px;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <header class="site-header">
        <div class="logo-container">
            <h1>Compra<span>Jogos</span><small>.com.br</small></h1>
            <p>KEYS & OFERTAS</p>
        </div>
        <div class="search-container">
            <input type="text" id="search-input" placeholder="Pesquisar jogos...">
            <button id="search-btn">Pesquisar</button>
        </div>
    </header>

    <main>
        <!-- Seção de Destaques Misturados (Pagos & Gratuitos) -->
        <section class="destaques-container-wrapper">
            <h2 class="section-title">🔥 Destaques: Melhores Jogos Pagos & Gratuitos</h2>
            <div id="destaques-grid" class="destaques-grid">
                <!-- Inserido via JavaScript -->
            </div>
        </section>

        <!-- Catálogo Geral de Jogos -->
        <section class="catalog-section">
            <h2 class="section-title">🎮 Catálogo de Jogos e Ofertas</h2>
            <div id="catalogo-grid" class="catalogo-grid">
                <!-- Inserido via JavaScript -->
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <p>&copy; 2026 CompraJogos.com.br - Todos os direitos reservados.</p>
    </footer>

    <script src="index.js"></script>
</body>
</html>

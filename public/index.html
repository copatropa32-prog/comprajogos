<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Compra Jogos - As Melhores Ofertas de Keys e Jogos</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-white min-h-screen font-sans">

  <!-- Cabeçalho -->
  <header class="border-b border-gray-800 bg-gray-900/80 backdrop-blur sticky top-0 z-50 p-4">
    <div class="container mx-auto flex justify-between items-center">
      <h1 class="text-2xl font-black tracking-wider text-green-400">
        Compra<span class="text-white">Jogos</span><span class="text-xs text-gray-500 font-normal">.com.br</span>
      </h1>
      <nav class="space-x-6 text-sm font-semibold">
        <a href="#" class="text-green-400 border-b-2 border-green-400 pb-1">Ofertas</a>
        <a href="#" class="text-gray-400 hover:text-white transition">Lojas</a>
      </nav>
    </div>
  </header>

  <!-- Banner -->
  <section class="py-12 bg-gradient-to-b from-gray-900 to-gray-950 text-center border-b border-gray-800/50">
    <div class="container mx-auto px-4">
      <span class="bg-green-500/10 text-green-400 text-xs font-bold px-3 py-1 rounded-full border border-green-500/20 uppercase tracking-widest">
        🔥 Ofertas em Tempo Real
      </span>
      <h2 class="text-4xl sm:text-5xl font-black mt-4 mb-2 tracking-tight">As Melhores Keys de PC</h2>
      <p class="text-gray-400 max-w-xl mx-auto text-sm sm:text-base">
        Sincronizado automaticamente com os maiores descontos do mercado digital.
      </p>
    </div>
  </section>

  <!-- Catálogo -->
  <main class="container mx-auto py-10 px-4">
    <h3 class="text-xl font-bold mb-6 text-gray-200 flex items-center gap-2">
      <span class="w-2 h-2 rounded-full bg-green-400"></span>
      Destaques do Dia
    </h3>
    
    <div id="catalog" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
      <div class="bg-gray-900 border border-gray-800 p-8 rounded-xl animate-pulse flex items-center justify-center text-gray-500 col-span-full">
        Buscando melhores ofertas...
      </div>
    </div>
  </main>

  <script>
    async function loadProducts() {
      const container = document.getElementById('catalog');
      try {
        const res = await fetch('/api/products');
        const products = await res.json();

        if (products.error) {
          container.innerHTML = `<p class="text-red-400 col-span-full">Erro: ${products.error}</p>`;
          return;
        }

        container.innerHTML = products.map(item => `
          <div class="bg-gray-900 rounded-xl overflow-hidden border border-gray-800 hover:border-green-500/50 hover:shadow-lg hover:shadow-green-500/5 transition flex flex-col justify-between group">
            
            <div class="relative bg-gray-950 h-40 overflow-hidden flex items-center justify-center">
              <img src="${item.thumb}" alt="${item.title}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300" />
              ${item.savings > 0 ? `
                <span class="absolute top-2 right-2 bg-green-500 text-gray-950 text-xs font-black px-2 py-1 rounded">
                  -${item.savings}%
                </span>
              ` : ''}
            </div>

            <div class="p-4 flex-1 flex flex-col justify-between">
              <div>
                <h4 class="font-bold text-base text-gray-100 line-clamp-2 mb-1 group-hover:text-green-400 transition">
                  ${item.title}
                </h4>
                ${item.rating ? `
                  <p class="text-xs text-gray-400">👍 ${item.rating}% avaliações positivas</p>
                ` : ''}
              </div>

              <div class="flex justify-between items-end mt-6 border-t border-gray-800/80 pt-3">
                <div>
                  <span class="text-xs text-gray-500 line-through block">$ ${item.normalPrice}</span>
                  <span class="text-xl font-extrabold text-green-400">$ ${item.salePrice}</span>
                </div>
                <a 
                  href="https://www.cheapshark.com/redirect?dealID=${item.id}" 
                  target="_blank" 
                  class="bg-green-500 hover:bg-green-400 text-gray-950 font-bold px-3 py-2 rounded-lg text-xs transition"
                >
                  Ver Oferta
                </a>
              </div>
            </div>

          </div>
        `).join('');

      } catch (err) {
        container.innerHTML = `<p class="text-red-400 col-span-full">Erro de conexão: ${err.message}</p>`;
      }
    }

    loadProducts();
  </script>
</body>
</html>

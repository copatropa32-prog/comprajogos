<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Promoções - CompraJogos</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Arial, sans-serif;
      background-color: #0d0d0d;
      color: #f2f2f2;
    }
    header {
      background: linear-gradient(90deg, #111, #222);
      padding: 20px;
      text-align: center;
      border-bottom: 3px solid #ff0066;
    }
    header h1 {
      margin: 0;
      color: #ff0066;
      font-size: 2.5em;
    }
    nav {
      display: flex;
      justify-content: center;
      background-color: #1a1a1a;
      padding: 15px;
    }
    nav a {
      color: #f2f2f2;
      text-decoration: none;
      margin: 0 20px;
      font-weight: bold;
      transition: color 0.3s;
    }
    nav a:hover {
      color: #ff0066;
    }
    .promocoes {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      padding: 40px;
    }
    .promo {
      background-color: #1a1a1a;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 20px;
      text-align: center;
      transition: transform 0.2s, border-color 0.2s;
    }
    .promo:hover {
      transform: scale(1.05);
      border-color: #ff0066;
    }
    .promo img {
      max-width: 100%;
      border-radius: 5px;
    }
    .promo h3 {
      margin: 15px 0 10px;
      color: #ff0066;
    }
    .promo p {
      font-size: 14px;
      color: #ccc;
    }
    .botao {
      display: inline-block;
      margin-top: 10px;
      padding: 10px 20px;
      background-color: #ff0066;
      color: #fff;
      font-weight: bold;
      border-radius: 5px;
      text-decoration: none;
      transition: background-color 0.3s;
    }
    .botao:hover {
      background-color: #cc0052;
    }
    footer {
      background-color: #111;
      text-align: center;
      padding: 20px;
      border-top: 3px solid #ff0066;
      margin-top: 40px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Promoções</h1>
    <p>Ofertas imperdíveis para gamers!</p>
  </header>
  <nav>
    <a href="index.html">Home</a>
    <a href="promocoes.html">Promoções</a>
    <a href="#">Contato</a>
  </nav>
  <section class="promocoes">
    <div class="promo">
      <img src="https://via.placeholder.com/250x150" alt="Promoção Jogo 1">
      <h3>Jogo em Promoção</h3>
      <p>De R$199,90 por R$99,90!</p>
      <a href="#" class="botao">Comprar na Nuuvem</a>
    </div>
    <div class="promo">
      <img src="https://via.placeholder.com/250x150" alt="Promoção Jogo 2">
      <h3>Jogo em Promoção 2</h3>
      <p>De R$149,90 por R$59,90!</p>
      <a href="#" class="botao">Comprar na Nuuvem</a>
    </div>
    <!-- Adicione mais promoções aqui -->
  </section>
  <footer>
    <p>&copy; 2026 CompraJogos - Todos os direitos reservados</p>
  </footer>
</body>
</html>

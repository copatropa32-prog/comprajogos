<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalhes do Jogo - CompraJogos</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .produto-container { display: flex; flex-wrap: wrap; gap: 40px; align-items: center; }
        .produto-imagem { flex: 1; min-width: 300px; }
        .produto-imagem img { width: 100%; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .produto-info { flex: 1; min-width: 300px; }
        .preco { font-size: 28px; color: #66c0f4; font-weight: bold; margin: 20px 0; }
        .btn-comprar-grande { background-color: #5c7e10; color: #fff; padding: 15px 30px; border-radius: 4px; text-decoration: none; font-size: 18px; font-weight: bold; display: inline-block; transition: background 0.2s; }
        .btn-comprar-grande:hover { background-color: #7da515; }
    </style>
</head>
<body>
    <header>
        <h1>CompraJogos</h1>
        <div class="nav-links">
            <a href="index.html">Início</a>
            <a href="quem-somos.html">Quem Somos</a>
            <a href="suporte.html">Suporte & FAQ</a>
        </div>
    </header>
    <main class="container">
        <div class="produto-container">
            <div class="produto-imagem">
                <img id="imgJogo" src="" alt="Capa do Jogo">
            </div>
            <div class="produto-info">
                <h1 id="tituloJogo">Carregando...</h1>
                <p id="descJogo">Chave digital de ativação oficial para a plataforma Steam. Envio instantâneo após a confirmação do pagamento via Pix.</p>
                <div class="preco" id="precoJogo">R$ 0,00</div>
                <a href="#" class="btn-comprar-grande">Comprar Agora (Pix)</a>
            </div>
        </div>
    </main>
    <footer><p>&copy; 2026 CompraJogos. Todos os direitos reservados.</p></footer>

    <script>
        const params = new URLSearchParams(window.location.search);
        const titulo = params.get('titulo');
        const preco = params.get('preco');
        const img = params.get('img');

        if (titulo) {
            document.getElementById('tituloJogo').innerText = titulo;
            document.getElementById('precoJogo').innerText = preco;
            document.getElementById('imgJogo').src = img;
            document.title = titulo + " - CompraJogos";
        } else {
            document.getElementById('tituloJogo').innerText = "Jogo não encontrado";
            document.getElementById('precoJogo').innerText = "";
        }
    </script>
</body>
</html>

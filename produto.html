<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><title>Detalhes</title><link rel="stylesheet" href="style.css"></head>
<body>
    <main class="container">
        <div class="produto-container">
            <h1 id="tituloJogo">Carregando...</h1>
            <p id="precoJogo" style="font-size:24px; color:#4CAF50;"></p>
            <a id="btnComprar" href="#" class="btn-comprar-grande">Comprar Agora</a>
        </div>
        <div class="relacionados"><h3>Você também pode gostar</h3><div id="gridRel" class="grid-catalogo"></div></div>
    </main>
    <script>
        const params = new URLSearchParams(window.location.search);
        document.getElementById('tituloJogo').innerText = params.get('titulo');
        document.getElementById('precoJogo').innerText = params.get('preco');
    </script>
</body>
</html>

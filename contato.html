<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Contato - CompraJogos</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Arial, sans-serif;
      background-color: #0d0d0d;
      color: #f2f2f2;
    }
    header {
      background: linear-gradient(90deg, #111, #222);
      padding: 20px;
      text-align: center;
      border-bottom: 3px solid #00ffcc;
    }
    header h1 {
      margin: 0;
      color: #00ffcc;
      font-size: 2.5em;
    }
    nav {
      display: flex;
      justify-content: center;
      background-color: #1a1a1a;
      padding: 15px;
    }
    nav a {
      color: #f2f2f2;
      text-decoration: none;
      margin: 0 20px;
      font-weight: bold;
      transition: color 0.3s;
    }
    nav a:hover {
      color: #00ffcc;
    }
    .contato {
      max-width: 600px;
      margin: 40px auto;
      background-color: #1a1a1a;
      padding: 30px;
      border-radius: 8px;
      border: 1px solid #333;
    }
    .contato h2 {
      color: #00ffcc;
      text-align: center;
    }
    .contato label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }
    .contato input, .contato textarea {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border-radius: 5px;
      border: none;
      background-color: #333;
      color: #f2f2f2;
    }
    .contato button {
      margin-top: 20px;
      padding: 10px 20px;
      background-color: #00ffcc;
      color: #000;
      font-weight: bold;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    .contato button:hover {
      background-color: #00cca3;
    }
    footer {
      background-color: #111;
      text-align: center;
      padding: 20px;
      border-top: 3px solid #00ffcc;
      margin-top: 40px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Contato</h1>
    <p>Fale com a equipe do CompraJogos</p>
  </header>
  <nav>
    <a href="index.html">Home</a>
    <a href="promocoes.html">Promoções</a>
    <a href="contato.html">Contato</a>
  </nav>
  <section class="contato">
    <h2>Envie sua mensagem</h2>
    <form>
      <label for="nome">Nome:</label>
      <input type="text" id="nome" name="nome" required>

      <label for="email">Email:</label>
      <input type="email" id="email" name="email" required>

      <label for="mensagem">Mensagem:</label>
      <textarea id="mensagem" name="mensagem" rows="5" required></textarea>

      <button type="submit">Enviar</button>
    </form>
    <p style="text-align:center; margin-top:20px;">Ou fale com a gente pelas redes sociais:</p>
    <p style="text-align:center;">
      <a href="#" style="color:#00ffcc;">Instagram</a> | 
      <a href="#" style="color:#00ffcc;">Facebook</a> | 
      <a href="#" style="color:#00ffcc;">Twitter</a>
    </p>
  </section>
  <footer>
    <p>&copy; 2026 CompraJogos - Todos os direitos reservados</p>
  </footer>
</body>
</html>
